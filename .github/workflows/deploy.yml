name: Deploy

# The site is built by Nix, not by mdBook alone: the landing page stylesheet is
# generated by Tailwind, and the CNAME is copied into the output. `nix build .#book`
# does all of it, so CI and a local build cannot drift.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build
        run: nix build .#book --print-build-logs

      - name: Check the landing page was styled
        run: |
          set -euo pipefail
          test -s result/css/site.css
          grep -q 'bg-pd-blue' result/css/site.css
          test -s result/handbook/_Handbook.html

      # upload-pages-artifact tars the directory, and Nix store outputs are
      # read-only, so give it a writable copy with symlinks dereferenced.
      - name: Stage the artifact
        run: |
          cp -rL result site
          chmod -R u+w site
          # CNAME claims www.puredarwin.org. Only the canonical repository may
          # publish it; a fork deploying with that file would take the domain
          # over. Forks get their own github.io address instead.
          if [ "$GITHUB_REPOSITORY" != "$CANONICAL_REPO" ]; then
            echo "not $CANONICAL_REPO, dropping CNAME"
            rm -f site/CNAME
          fi
        env:
          CANONICAL_REPO: PureDarwin/puredarwin.github.io

      # Not gated on `push`: a manual run is how you deploy after enabling
      # Pages on a fork, without having to invent a commit.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
